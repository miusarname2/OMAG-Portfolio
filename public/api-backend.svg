<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <!-- Brackets and Slash -->
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- < -->
    <polyline points="100,120 60,145 100,170"/>
    
    <!-- / -->
    <line x1="285" y1="180" x2="310" y2="110" />
    
    <!-- > -->
    <polyline points="325,120 365,145 325,170"/>
  </g>
  
  <!-- Main "APIs" Text -->
  <text x="195" y="165" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="76" fill="#ffffff" text-anchor="middle" letter-spacing="1">APIs</text>
  
  <!-- "REST" Section -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <!-- Left Dash -->
    <line x1="130" y1="215" x2="160" y2="215"/>
    <!-- Right Dash -->
    <line x1="240" y1="215" x2="270" y2="215"/>
  </g>
  
  <text x="200" y="224" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="26" fill="#ffffff" text-anchor="middle" letter-spacing="8">REST</text>
</svg>
